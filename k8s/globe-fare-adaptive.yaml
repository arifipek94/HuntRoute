
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: huntrouteacr43776.azurecr.io/huntroute:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---


apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer  
  selector:
    app: backend
  ports:
    - port: 80        
      targetPort: 3000  
